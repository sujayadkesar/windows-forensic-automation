name: Bug report
description: Crash, error message or processing problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Include the message and the log (Processing page or %APPDATA%\WindowsForensicAutomation\logs)"}
    validations: {required: true}
  - type: input
    id: evidence
    attributes: {label: Evidence format, placeholder: "E01 / Ex01 / raw / VMDK / VHDX / triage folder"}
  - type: input
    id: profile
    attributes: {label: Profile}
  - type: input
    id: version
    attributes: {label: Tool version}
