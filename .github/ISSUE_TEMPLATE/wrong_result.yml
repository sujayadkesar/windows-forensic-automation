name: Wrong result
description: A parser, analyzer, figure or report states something that is not in the evidence
labels: [accuracy]
body:
  - type: markdown
    attributes:
      value: "Accuracy problems are treated as the highest priority. Please do not attach real case data."
  - type: input
    id: artifact
    attributes: {label: Artifact / finding, placeholder: "e.g. USB device last connected time, LNK target path"}
    validations: {required: true}
  - type: textarea
    id: wrong
    attributes: {label: What the tool reported}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What the evidence actually contains, description: "How you verified it (another tool, manual decoding, answer key)"}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: Windows version of the evidence, placeholder: "Windows 7 SP1 / Windows 10 22H2 / Windows 11 24H2"}
  - type: input
    id: version
    attributes: {label: Tool version}
