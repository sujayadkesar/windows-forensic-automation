# Tool knowledge base: executables, install paths, services and log locations for
# tool families that matter in investigations.  Matching is case-insensitive.
#   exe:      executable file names (used against prefetch, amcache, shimcache, BAM, 4688, Sysmon...)
#   paths:    path fragments (installed location / artifact location)
#   services: service names
#   logs:     glob patterns (relative to the system drive) of tool logs worth collecting
#   names:    whole words matched against installed-program names (Uninstall keys)
#   dual_use: transfer tools that are reported as programs of interest in every case type (everyday
#             sync / messaging clients are only reported by the data-exfiltration analyzers)
# Contributions welcome - add a new entry and every module/analyzer picks it up.

remote_access:
  AnyDesk:
    exe: [anydesk.exe]
    paths: ["\\anydesk\\", "\\programdata\\anydesk"]
    services: [anydesk]
    logs: ["ProgramData/AnyDesk/ad_svc.trace", "ProgramData/AnyDesk/connection_trace.txt", "Users/*/AppData/Roaming/AnyDesk/ad.trace",
           "Users/*/AppData/Roaming/AnyDesk/connection_trace.txt", "Users/*/AppData/Roaming/AnyDesk/user.conf", "ProgramData/AnyDesk/system.conf"]
  TeamViewer:
    exe: [teamviewer.exe, teamviewer_service.exe, tv_w32.exe, tv_x64.exe, teamviewerqs.exe]
    paths: ["\\teamviewer\\"]
    services: [teamviewer]
    logs: ["Program Files/TeamViewer/Connections_incoming.txt", "Program Files (x86)/TeamViewer/Connections_incoming.txt",
           "Program Files/TeamViewer/TeamViewer*_Logfile*.log", "Program Files (x86)/TeamViewer/TeamViewer*_Logfile*.log",
           "Users/*/AppData/Roaming/TeamViewer/Connections.txt", "Users/*/AppData/Local/Temp/TeamViewer/*.log"]
  ScreenConnect / ConnectWise Control:
    names: ["screenconnect", "connectwise control"]
    exe: [screenconnect.clientservice.exe, screenconnect.windowsclient.exe, screenconnect.windowsbackstageshell.exe, connectwisecontrol.client.exe]
    paths: ["\\screenconnect client", "\\connectwise control client"]
    services: ["screenconnect client"]
    logs: ["ProgramData/ScreenConnect Client*/user.config", "Program Files (x86)/ScreenConnect Client*/system.config"]
  Splashtop:
    exe: [srservice.exe, srmanager.exe, strwinclt.exe, srfeature.exe, sragent.exe]
    paths: ["\\splashtop\\"]
    services: [splashtopremoteservice]
    logs: ["ProgramData/Splashtop/Temp/log/*.log", "Program Files (x86)/Splashtop/Splashtop Remote/Server/log/*.txt"]
  Atera:
    exe: [ateraagent.exe, agentpackagemonitoring.exe, agentpackagerunCommandinteractive.exe]
    paths: ["\\atera networks\\", "\\ateraagent\\"]
    services: [ateraagent]
    logs: []
  RustDesk:
    exe: [rustdesk.exe]
    paths: ["\\rustdesk\\"]
    services: [rustdesk]
    logs: ["Users/*/AppData/Roaming/RustDesk/log/*.log", "Windows/ServiceProfiles/LocalService/AppData/Roaming/RustDesk/log/server/*.log"]
  Zoho Assist:
    names: ["zoho assist"]
    exe: [zohours.exe, zaservice.exe, zohomeeting.exe, za_connect.exe]
    paths: ["\\zohomeeting\\", "\\zoho assist"]
    services: [zohoassist]
    logs: []
  LogMeIn / GoTo:
    names: ["logmein", "goto resolve", "gotoassist", "goto opener"]
    exe: [logmein.exe, lmiguardiansvc.exe, g2ax_comm_expert.exe, gotoassist.exe, logmeinrescue.exe, gotoresolve.exe]
    paths: ["\\logmein\\", "\\gotoassist", "\\goto resolve"]
    services: [logmein]
    logs: []
  Remote Utilities:
    exe: [rutserv.exe, rfusclient.exe]
    paths: ["\\remote utilities"]
    services: [rmanservice]
    logs: []
  NetSupport Manager:
    names: ["netsupport"]
    exe: [client32.exe, pcicfgui.exe, nsm.exe]
    paths: ["\\netsupport\\"]
    services: [client32]
    logs: []
  NinjaOne:
    names: ["ninjarmm", "ninjaone"]
    exe: [ninjarmmagent.exe, ninjarmmagentpatcher.exe]
    paths: ["\\ninjarmmagent", "\\ninjarmm"]
    services: [ninjarmmagent]
    logs: []
  Kaseya VSA:
    names: ["kaseya"]
    exe: [agentmon.exe, kaseyaremotecontrolhost.exe]
    paths: ["\\kaseya\\"]
    services: [kaseya agent]
    logs: []
  Action1:
    exe: [action1_agent.exe, action1_remote.exe]
    paths: ["\\action1\\"]
    services: [a1agent]
    logs: []
  SimpleHelp:
    exe: [remote access.exe, simplegatewayservice.exe, simplehelp.exe]
    paths: ["\\jwrapper-remote access", "\\simplehelp"]
    services: [simplehelp]
    logs: []
  MeshCentral:
    names: ["mesh agent", "meshcentral"]
    exe: [meshagent.exe]
    paths: ["\\mesh agent\\"]
    services: ["mesh agent"]
    logs: []
  Tactical RMM:
    names: ["tactical rmm", "tacticalagent"]
    exe: [tacticalrmm.exe]
    paths: ["\\tacticalagent\\"]
    services: [tacticalrmm]
    logs: []
  Getscreen:
    exe: [getscreen.exe]
    paths: ["\\getscreen"]
    services: [getscreen]
    logs: []
  Chrome Remote Desktop:
    names: ["chrome remote desktop"]
    exe: [remoting_host.exe, remoting_desktop.exe]
    paths: ["\\chrome remote desktop\\"]
    services: [chromoting]
    logs: []
  Quick Assist:
    builtin: true   # part of Windows 10 / 11: reported only when run, not for being present
    exe: [quickassist.exe]
    paths: ["\\quickassist"]
    services: []
    logs: []
  Ammyy Admin:
    exe: [aa_v3.exe, ammyy_admin.exe]
    paths: ["\\ammyy"]
    services: []
    logs: []
  UltraVNC / TightVNC / RealVNC:
    names: ["ultravnc", "tightvnc", "realvnc", "vnc server", "tigervnc"]
    exe: [winvnc.exe, tvnserver.exe, vncserver.exe, vncviewer.exe, tvnviewer.exe]
    paths: ["\\ultravnc", "\\tightvnc", "\\realvnc"]
    services: [uvnc_service, tvnserver, vncserver]
    logs: ["Program Files/uvnc bvba/UltraVNC/WinVNC.log"]
  ngrok:
    exe: [ngrok.exe]
    paths: ["\\ngrok"]
    services: []
    logs: []
  Radmin:
    exe: [radmin.exe, rserver3.exe]
    paths: ["\\radmin"]
    services: [rserver3]
    logs: []

